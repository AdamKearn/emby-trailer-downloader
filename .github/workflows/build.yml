name: Build plugin

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Emby.TrailerDownloader -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Emby.TrailerDownloader
          path: Emby.TrailerDownloader/bin/Release/netstandard2.0/Emby.TrailerDownloader.dll
